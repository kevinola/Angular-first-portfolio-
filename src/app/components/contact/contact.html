<section id="contact" class="contact-section">
  <div class="wrap">

    <div class="sub-title">
      <span>06</span>
      <span>contact</span>
    </div>

    <form class="contact-form" (ngSubmit)="sendMessage()">
      <div class="form-group">
        <label for="name">Name</label>
        <input [(ngModel)]="name" type="text" id="name" name="name" placeholder="Your name" maxlength="100" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input [(ngModel)]="email" type="email" id="email" name="email" placeholder="Your email address" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" [(ngModel)]="message" placeholder="Write your message here..." maxlength="5000" required></textarea>
      </div>

      <!-- Honeypot: hidden from people, bots tend to fill it in -->
      <div style="position:absolute; left:-9999px;" aria-hidden="true">
        <label for="website">Leave this empty</label>
        <input [(ngModel)]="website" type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" class="submit-btn" [disabled]="status === 'sending'">
        {{ status === 'sending' ? 'Sending...' : 'Send Message' }}
      </button>
    </form>

    <p *ngIf="status === 'success'" role="status">
      Thanks, {{ sentName }}! Your message has been sent.
    </p>
    <p *ngIf="status === 'error'" role="alert">
      {{ errorText }}
    </p>

  </div>
</section>
