<section id="contact" class="contact-section">
  <div class="wrap">

    <div class="sub-title">
      <span>06</span>
      <span>contact</span>
    </div>

    <form class="contact-form" (ngSubmit)="sendMessage(); $event.preventDefault()">
      <div class="form-group">
        <label for="name">Name</label>
        <input [(ngModel)]="name" type="text" id="name" name="name" placeholder="Your name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input [(ngModel)]="email" type="email" id="email" name="email" placeholder="Your email address" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" [(ngModel)]="message" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>

    <p *ngIf="status === 'success'">
      Thanks, {{ name }}! Your form has been submitted.
    </p>

  </div> 
</section>
